<h2>Liar's Dice Game</h2>

<div class="game-container">

  <p>Welcome to the table, <span id="player-name"></span>!</p>

  <h3>🎲 Your dice:</h3>
  <div id="player-dice"></div>

  <h3>Select Dice Type</h3>

  <select id="dice-type">
  <option value="6">6-sided dice</option>
  <option value="20">20-sided dice</option>
  </select>
  
  <h3>Select Dice Colour</h3>

  <select id="dice-colour">
  <option value="gold">Gold</option>
  <option value="red">Red</option>
  <option value="blue">Blue</option>
  <option value="green">Green</option>
  </select>

  <br><br>

  <button id="roll-btn">Start Game</button>
  <button id="back-dashboard-btn">Back to Dashboard</button>

  <hr>

  <h3>Make a Bid</h3>

  <input id="bid-quantity" type="number" placeholder="Quantity">
  <input id="bid-value" type="number" min="1" max="6" placeholder="Value">

  <br><br>

  <button id="bid-btn">Place Bid</button>
  <button id="liar-btn">Call Liar</button>

  <hr>

  <h3>Game Log</h3>
  <pre id="game-log"></pre>

</div>
